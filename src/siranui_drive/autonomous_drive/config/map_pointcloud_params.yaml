/**:
  map_pointcloud_publisher:
    ros__parameters:
      frame_id: "map"
      topic_name: "map"
      publish_rate: 1.0
      # map 座標系で地面 z=0 とみなし、その上のスライスを配信
      min_height: -10.0
      max_height: 100.0
      crop_radius: 0.0   # 0 = 全範囲、>0 なら map 原点からの XY 半径 [m]
      voxel_leaf_size: 0.0
