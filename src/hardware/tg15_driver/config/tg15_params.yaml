/**:
  tg15_driver:
    ros__parameters:
      port: "/dev/ttyUSB0"        # シリアルポートデバイス
      baudrate: 512000            # ボーレート（TG15は512000固定）
      frame_id: "laser_frame"     # スキャンのフレームID
      range_min: 0.05             # 最小距離 [m]
      range_max: 15.0             # 最大距離 [m]（TG15の最大測距）
      angle_min_deg_1: 0.0        # 使用角度範囲1の下限 [deg]
      angle_max_deg_1: 40.0      # 使用角度範囲1の上限 [deg]
      angle_min_deg_2: 320.0      # 使用角度範囲2の下限 [deg]（不使用時は min > max）
      angle_max_deg_2: 360.0        # 使用角度範囲2の上限 [deg]
      scan_frequency: 10.0        # スキャン周波数 [Hz]（3.0〜15.7）
      reversion: true             # 180度回転補正
      inverted: true              # 回転方向反転（ROSのCCW正に合わせる）
      invalid_range_is_inf: false # 無効点をinfにする（falseなら0.0）
