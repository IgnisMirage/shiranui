services:
  shiranui:
    image: ghcr.io/ignismirage/shiranui:latest
    pull_policy: always
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    command: ["ros2", "launch", "autonomous_drive", "autonomous_drive.launch.xml", "can_interface:=${CAN_INTERFACE:-can0}"]
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyAMA10:/dev/ttyAMA10
      - /dev/bus/usb:/dev/bus/usb
    # joy_node (SDL2) は /dev/input/event* を使う。抜き差しで番号が変わるのでディレクトリごと渡す
    volumes:
      - /dev/input:/dev/input
    device_cgroup_rules:
      - 'c 13:* rmw'
