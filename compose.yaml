services:
  shiranui:
    image: ghcr.io/ignismirage/shiranui:latest
    pull_policy: always
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    command: ["ros2", "launch", "autonomous_drive", "autonomous_drive.launch.xml", "can_interface:=${CAN_INTERFACE:-can0}"]
    devices:
      - /dev/ttyAMA10:/dev/ttyAMA10
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev/input:/dev/input
      - ./map/map.pcd:/ros2_ws/install/autonomous_drive/share/autonomous_drive/map/map.pcd:ro
    device_cgroup_rules:
      - 'c 13:* rmw'
