name: Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR は小文字のみ。compose.yaml と揃える
  IMAGE: ghcr.io/ignismirage/shiranui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        uses: actions/github-script@v7
        with:
          script: |
            const packageName = 'shiranui';
            const owner = context.repo.owner;

            const { data: account } = await github.rest.users.getByUsername({
              username: owner,
            });

            try {
              if (account.type === 'Organization') {
                await github.rest.packages.setPackageVisibilityInOrganization({
                  org: owner,
                  package_type: 'container',
                  package_name: packageName,
                  visibility: 'public',
                });
              } else {
                await github.rest.packages.setPackageVisibilityForAuthenticatedUser({
                  package_type: 'container',
                  package_name: packageName,
                  visibility: 'public',
                });
              }
              core.info('Package visibility set to public');
            } catch (error) {
              core.warning(
                `Could not set package visibility automatically: ${error.message}. ` +
                  'Use docker login ghcr.io with a PAT (read:packages) to pull private images.',
              );
            }
