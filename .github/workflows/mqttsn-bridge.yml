name: MQTT-SN bridge

on:
  push:
    branches:
      - main
    paths:
      - 'mqttsn_bridge/**'
      - 'Dockerfile'
      - '.github/workflows/mqttsn-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ignismirage/shiranui-mqttsn-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: mqttsn_bridge
        run: python3 -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 純 Python なので QEMU でも問題ない (linux/arm64 は Raspberry Pi 用)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: mqttsn-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mqttsn-bridge
          cache-to: type=gha,scope=mqttsn-bridge,mode=max

      # GITHUB_TOKEN ではユーザー所有パッケージの公開設定を変えられないことがある。
      # 失敗しても無視するので、初回は GitHub Packages の設定で Public にする。
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          package="shiranui-mqttsn-bridge"
          if gh api "users/${owner}" --jq .type | grep -q Organization; then
            gh api --method PUT "/orgs/${owner}/packages/container/${package}/visibility" -f visibility=public
          else
            gh api --method PATCH "/user/packages/container/${package}/visibility" -f visibility=public
          fi || echo "::warning::Could not set package visibility to public; set it manually."
